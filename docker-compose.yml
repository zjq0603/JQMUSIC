services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: jqmusic
      MYSQL_USER: jqmusic
      MYSQL_PASSWORD: ${JQMUSIC_DB_PASSWORD:-change-this-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-root-password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
  navidrome:
    image: deluan/navidrome:latest
    user: "1000:1000"
    restart: unless-stopped
    ports: ["4533:4533"]
    environment:
      ND_LOGLEVEL: info
      ND_SCANSCHEDULE: 1h
      ND_SESSIONTIMEOUT: 24h
      ND_BASEURL: ""
    volumes:
      - navidrome_data:/data
      - ./music:/music:ro
  app:
    build: .
    restart: unless-stopped
    ports: ["3000:3000"]
    depends_on:
      mysql: { condition: service_healthy }
    volumes:
      - ./config.json:/app/config.json:ro

volumes:
  mysql_data:
  navidrome_data:
